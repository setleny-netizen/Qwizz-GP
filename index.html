<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по Гарри Поттеру</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    background-attachment: fixed;
    overflow: hidden;
  }

  /* ===== ЭКРАН 1 ===== */
  #start-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: opacity 0.45s ease, transform 0.45s ease;
    z-index: 2;
  }
  #start-screen.fade-out {
    opacity: 0;
    transform: scale(1.1);
    pointer-events: none;
  }

  .card-btn {
    width: 100%;
    max-width: 600px;
    padding: clamp(24px, 6vw, 50px) clamp(20px, 8vw, 70px);
    border-radius: clamp(16px, 4vw, 25px);
    border: 5px solid #c9a227;
    background: rgba(20, 15, 40, 0.6);
    box-shadow: 0 0 30px rgba(201, 162, 39, 0.4),
                inset 0 0 20px rgba(201, 162, 39, 0.15);
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 45px rgba(201, 162, 39, 0.7),
                inset 0 0 25px rgba(201, 162, 39, 0.25);
  }
  .card-btn:active { transform: scale(0.98); }
  .card-btn h1 {
    color: #f5e6c8;
    font-size: clamp(1.3rem, 5vw, 2.2rem);
    letter-spacing: clamp(1px, 0.5vw, 2px);
    line-height: 1.3;
    text-shadow: 0 0 10px rgba(201, 162, 39, 0.8);
    font-weight: normal;
  }

  /* ===== ЭКРАН ВОПРОСА ===== */
  #quiz-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s ease;
    z-index: 1;
  }
  #quiz-screen.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    z-index: 3;
  }

  .quiz-card {
    width: 100%;
    max-width: 560px;
    padding: clamp(20px, 5vw, 40px);
    border-radius: clamp(16px, 4vw, 25px);
    border: 5px solid #c9a227;
    background: rgba(20, 15, 40, 0.85);
    box-shadow: 0 0 30px rgba(201, 162, 39, 0.4),
                inset 0 0 20px rgba(201, 162, 39, 0.15);
    text-align: center;
    margin: auto;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .quiz-card.switching {
    opacity: 0;
    transform: translateX(-30px);
  }
  .quiz-card.entering {
    opacity: 0;
    transform: translateX(30px);
  }

  .quiz-card .q-number {
    color: #c9a227;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .quiz-card img {
    width: 100%;
    max-width: 300px;
    aspect-ratio: 1 / 1;
    height: auto;
    object-fit: contain;
    border-radius: 14px;
    border: 2px solid rgba(201, 162, 39, 0.6);
    margin: 0 auto 20px;
    display: block;
    background: rgba(0, 0, 0, 0.25);
    transition: opacity 0.35s ease;
  }
  .quiz-card img.fading { opacity: 0; }

  .quiz-card .question {
    color: #f5e6c8;
    font-size: clamp(1.05rem, 3.8vw, 1.4rem);
    line-height: 1.4;
    margin-bottom: 22px;
    text-shadow: 0 0 8px rgba(201, 162, 39, 0.5);
  }

  /* ===== варианты ответов ===== */
  .options {
    display: none;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 10px;
  }
  .options.visible { display: flex; }

  .option-btn {
    font-family: inherit;
    font-size: clamp(0.9rem, 3vw, 1.05rem);
    padding: 12px 18px;
    border-radius: 14px;
    border: 2px solid rgba(201, 162, 39, 0.6);
    background: rgba(201, 162, 39, 0.05);
    color: #f5e6c8;
    cursor: pointer;
    text-align: left;
    transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .option-btn:hover { background: rgba(201, 162, 39, 0.18); }
  .option-btn:active { transform: scale(0.98); }
  .option-btn.correct {
    background: rgba(46, 160, 67, 0.35);
    border-color: #2ea043;
    color: #eaffea;
  }
  .option-btn.wrong {
    background: rgba(180, 40, 40, 0.35);
    border-color: #b42828;
    color: #ffecec;
  }
  .option-btn:disabled { cursor: default; }

  .answer-btn,
  .next-btn {
    font-family: inherit;
    font-size: clamp(0.95rem, 3vw, 1.1rem);
    letter-spacing: 2px;
    padding: 12px 40px;
    border-radius: 40px;
    border: 3px solid #c9a227;
    background: transparent;
    color: #f5e6c8;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .answer-btn:hover,
  .next-btn:hover { background: rgba(201, 162, 39, 0.2); }
  .answer-btn:active,
  .next-btn:active { transform: scale(0.96); }

  /* ==== КНОПКА "СЛЕДУЮЩИЙ" — плавное появление ==== */
  .next-btn {
    display: inline-block;
    margin-top: 20px;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .next-btn.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* ==== БЛОК ОТВЕТА — плавно через grid, без max-height ==== */
  .answer {
    display: grid;
    grid-template-rows: 0fr;
    margin-top: 0;
    opacity: 0;
    color: #c9a227;
    font-size: clamp(1.1rem, 3.5vw, 1.35rem);
    font-style: italic;
    transition: grid-template-rows 0.4s ease,
                opacity 0.3s ease,
                margin-top 0.4s ease;
    overflow: hidden;
  }
  .answer.revealed {
    grid-template-rows: 1fr;
    opacity: 1;
    margin-top: 20px;
  }
  .answer > .answer-inner { min-height: 0; }

  /* ===== список с анимацией прилёта (чистый CSS delay) ===== */
  .answer-list {
    list-style: none;
    padding: 0;
    margin: 0;
    text-align: left;
    display: inline-block;
  }
  .answer-list li {
    opacity: 0;
    transform: translateX(-30px);
    padding: 6px 0;
    color: #c9a227;
    font-style: italic;
    font-size: clamp(1rem, 3.3vw, 1.25rem);
  }
  /* ключевая вещь: анимация запускается при .revealed, delay по индексу */
  .answer.revealed .answer-list li {
    animation: flyIn 0.4s ease forwards;
  }
  .answer.revealed .answer-list li:nth-child(1) { animation-delay: 0.00s; }
  .answer.revealed .answer-list li:nth-child(2) { animation-delay: 0.12s; }
  .answer.revealed .answer-list li:nth-child(3) { animation-delay: 0.24s; }
  .answer.revealed .answer-list li:nth-child(4) { animation-delay: 0.36s; }
  .answer.revealed .answer-list li:nth-child(5) { animation-delay: 0.48s; }

  @keyframes flyIn {
    0%   { opacity: 0; transform: translateX(-30px); }
    60%  { opacity: 1; transform: translateX(4px); }
    100% { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>

  <div id="start-screen">
    <button class="card-btn" id="start-btn">
      <h1>Тест по Гарри Поттеру №1</h1>
    </button>
  </div>

  <div id="quiz-screen">
    <div class="quiz-card" id="quiz-card">
      <div class="q-number" id="q-number">Вопрос #1</div>
      <img id="q-image" src="img/n1.jpg" alt="Вопрос 1">
      <div class="question" id="q-text">Какая сердцевина у палочки Волан-де-Морта?</div>

      <button class="answer-btn" id="answer-btn">Ответ</button>

      <div class="answer" id="answer">
        <div class="answer-inner" id="answer-inner"></div>
      </div>

      <div class="options" id="options"></div>

      <button class="next-btn" id="next-btn">Следующий вопрос →</button>
    </div>
  </div>

<script>
  const questions = [
    { type:'reveal', image:'img/n1.jpg',
      question:'Какая сердцевина у палочки Волан-де-Морта?',
      answer:'«Перо феникса»' },
    { type:'reveal', image:'img/n2.jpg',
      question:'Из какой породы дерева палочки Люциуса Малфоя?',
      answer:'Вяз' },
    { type:'options', image:'img/n3.jpg',
      question:'Выбери правильное название:',
      options:[
        {text:'Бузинная палочка', correct:true},
        {text:'Бузиная палочка',  correct:false},
        {text:'Бузиновая палочка', correct:false}
      ],
      answer:'Бузинная палочка' },
    { type:'reveal', image:'img/n4.jpg',
      question:'Какой размер у палочки Беллатрисы Лестрейндж?',
      answer:'12¾ дюйма' },
    { type:'reveal-swap', image:'img/n6.jpg', imageAfter:'img/n5.jpg',
      question:'Сколько лепестков у золотого яйца из фильма «Гарри Поттер и Кубок огня»?',
      answer:'3 лепестка' },
    { type:'reveal-swap', image:'img/n8.jpg', imageAfter:'img/n7.jpg',
      question:'Какого цвета волшебный глаз у Аластора Грюма?',
      answer:'Голубой' },
    { type:'reveal-list', image:'img/n9.jpg',
      question:'Назовите прозвища четырёх создателей Карты Мародёров в правильном порядке:',
      answers:['Лунатик','Хвост','Бродяга','Сохатый'] },
    { type:'reveal-list', image:'img/n10.jpg',
      question:'Какие три ингредиента были брошены в котел для воскрешения Волан-де-Морта:',
      answers:[
        'Кость отца, отданная не по своей воле',
        'Плоть слуги, отданная добровольно',
        'Кровь врага, взятая силой'
      ] },
    { type:'reveal-list', image:'img/n11.jpg',
      question:'Назовите три любые заклинания из «Гарри Поттера» на букву «Р»:',
      answers:['Ридикулус','Редукто','Репаро'] },
    { type:'reveal-list', image:'img/n12.jpg',
      question:'Назови все виды мячей для игры в квиддич:',
      answers:['Снитч','Квоффл','Бладжер'] }
  ];

  let currentIndex = 0;

  const startScreen = document.getElementById('start-screen');
  const quizScreen  = document.getElementById('quiz-screen');
  const startBtn    = document.getElementById('start-btn');
  const quizCard    = document.getElementById('quiz-card');
  const qNumber     = document.getElementById('q-number');
  const qImage      = document.getElementById('q-image');
  const qText       = document.getElementById('q-text');
  const answerBtn   = document.getElementById('answer-btn');
  const answerEl    = document.getElementById('answer');
  const answerInner = document.getElementById('answer-inner');
  const optionsEl   = document.getElementById('options');
  const nextBtn     = document.getElementById('next-btn');

  function renderQuestion(index) {
    const q = questions[index];

    qNumber.textContent = 'Вопрос #' + (index + 1);
    qImage.src = q.image;
    qImage.alt = 'Вопрос ' + (index + 1);
    qImage.classList.remove('fading');
    qText.textContent = q.question;

    answerInner.innerHTML = '';
    answerEl.classList.remove('revealed');

    optionsEl.innerHTML = '';
    optionsEl.classList.remove('visible');

    answerBtn.style.display = 'none';
    nextBtn.classList.remove('visible');

    if (q.type === 'options') {
      optionsEl.classList.add('visible');
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.text;
        btn.addEventListener('click', () => selectOption(btn, opt, q));
        optionsEl.appendChild(btn);
      });
    } else {
      answerBtn.style.display = 'inline-block';
    }
  }

  function selectOption(clickedBtn, opt, q) {
    const allBtns = optionsEl.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (opt.correct) {
      clickedBtn.classList.add('correct');
    } else {
      clickedBtn.classList.add('wrong');
      allBtns.forEach((b, i) => {
        if (q.options[i].correct) b.classList.add('correct');
      });
    }
    nextBtn.classList.add('visible');
  }

  startBtn.addEventListener('click', () => {
    startScreen.classList.add('fade-out');
    quizScreen.classList.add('show');
  });

  answerBtn.addEventListener('click', () => {
    const q = questions[currentIndex];

    // плавная замена картинки через transitionend (без магических таймеров)
    if (q.type === 'reveal-swap' && q.imageAfter) {
      qImage.classList.add('fading');
      qImage.addEventListener('transitionend', function onFade(e) {
        if (e.propertyName !== 'opacity') return;
        qImage.removeEventListener('transitionend', onFade);

        qImage.onload = () => qImage.classList.remove('fading');
        qImage.src = q.imageAfter;
        // если картинка уже в кэше — onload может не сработать
        if (qImage.complete) qImage.classList.remove('fading');
      });
    }

    if (q.type === 'reveal' || q.type === 'reveal-swap') {
      answerInner.textContent = q.answer;
    }

    if (q.type === 'reveal-list') {
      const ul = document.createElement('ul');
      ul.className = 'answer-list';
      q.answers.forEach((text, i) => {
        const li = document.createElement('li');
        li.textContent = text + (i < q.answers.length - 1 ? ';' : '');
        ul.appendChild(li);
      });
      answerInner.innerHTML = '';
      answerInner.appendChild(ul);
    }

    // одно изменение класса запускает и раскрытие блока, и каскад анимации списка
    answerEl.classList.add('revealed');
    answerBtn.style.display = 'none';
    nextBtn.classList.add('visible');
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex >= questions.length - 1) {
      nextBtn.classList.remove('visible');
      nextBtn.textContent = 'Тест завершён';
      return;
    }

    // фаза 1: карточка уезжает влево (чистый transition)
    quizCard.classList.add('switching');

    quizCard.addEventListener('transitionend', function onOut(e) {
      if (e.propertyName !== 'opacity') return;
      quizCard.removeEventListener('transitionend', onOut);

      // мгновенно меняем контент и ставим «входящее» состояние
      currentIndex++;
      renderQuestion(currentIndex);
      quizCard.classList.remove('switching');
      quizCard.classList.add('entering');

      // форсируем reflow, чтобы браузер зафиксировал entering-состояние
      void quizCard.offsetWidth;

      // фаза 2: карточка приезжает справа
      quizCard.classList.remove('entering');
    });
  });
</script>
</body>
</html>
