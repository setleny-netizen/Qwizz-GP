<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по Гарри Поттеру №1</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    background-attachment: fixed;
    overflow: hidden;
  }

  /* ===== ЭКРАН 1: стартовая кнопка ===== */
  #start-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 2;
  }

  #start-screen.fade-out {
    opacity: 0;
    transform: scale(1.15);
    pointer-events: none;
  }

  .card-btn {
    width: 100%;
    max-width: 600px;
    padding: clamp(24px, 6vw, 50px) clamp(20px, 8vw, 70px);
    border-radius: clamp(16px, 4vw, 25px);
    border: 5px solid #c9a227;
    background: rgba(20, 15, 40, 0.6);
    box-shadow: 0 0 30px rgba(201, 162, 39, 0.4),
                inset 0 0 20px rgba(201, 162, 39, 0.15);
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 45px rgba(201, 162, 39, 0.7),
                inset 0 0 25px rgba(201, 162, 39, 0.25);
  }

  .card-btn:active {
    transform: scale(0.98);
  }

  .card-btn h1 {
    color: #f5e6c8;
    font-size: clamp(1.3rem, 5vw, 2.2rem);
    letter-spacing: clamp(1px, 0.5vw, 2px);
    line-height: 1.3;
    text-shadow: 0 0 10px rgba(201, 162, 39, 0.8);
    font-weight: normal;
  }

  /* ===== ЭКРАН 2: вопрос ===== */
  #quiz-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
    opacity: 0;
    transform: translateY(30px);
    pointer-events: none;
    transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
    z-index: 1;
  }

  #quiz-screen.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    z-index: 3;
  }

  .quiz-card {
    width: 100%;
    max-width: 560px;
    padding: clamp(20px, 5vw, 40px);
    border-radius: clamp(16px, 4vw, 25px);
    border: 5px solid #c9a227;
    background: rgba(20, 15, 40, 0.85);
    box-shadow: 0 0 30px rgba(201, 162, 39, 0.4),
                inset 0 0 20px rgba(201, 162, 39, 0.15);
    text-align: center;
  }

  .quiz-card .q-number {
    color: #c9a227;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .quiz-card img {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: 14px;
    border: 2px solid rgba(201, 162, 39, 0.6);
    margin-bottom: 20px;
    display: block;
  }

  .quiz-card .question {
    color: #f5e6c8;
    font-size: clamp(1.05rem, 3.8vw, 1.4rem);
    line-height: 1.4;
    margin-bottom: 22px;
    text-shadow: 0 0 8px rgba(201, 162, 39, 0.5);
  }

  .answer-btn {
    font-family: inherit;
    font-size: clamp(0.95rem, 3vw, 1.1rem);
    letter-spacing: 2px;
    padding: 12px 40px;
    border-radius: 40px;
    border: 3px solid #c9a227;
    background: transparent;
    color: #f5e6c8;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.2s ease;
  }

  .answer-btn:hover {
    background: rgba(201, 162, 39, 0.2);
  }

  .answer-btn:active {
    transform: scale(0.96);
  }

  .answer {
    color: #c9a227;
    font-size: clamp(1.1rem, 3.5vw, 1.35rem);
    font-style: italic;
    margin-top: 20px;
    opacity: 0;
    max-height: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease, max-height 0.5s ease, margin-top 0.5s ease;
    overflow: hidden;
  }

  .answer.revealed {
    opacity: 1;
    max-height: 100px;
    transform: translateY(0);
  }
</style>
</head>
<body>

  <!-- Стартовый экран-кнопка -->
  <div id="start-screen">
    <button class="card-btn" id="start-btn">
      <h1>Тест по Гарри Поттеру №1</h1>
    </button>
  </div>

  <!-- Экран вопроса -->
  <div id="quiz-screen">
    <div class="quiz-card">
      <div class="q-number">Вопрос #1</div>
      <img src="img/n1.jpg" alt="Вопрос 1">
      <div class="question">Какая сердцевина у палочки Волан-де-Морта?</div>
      <button class="answer-btn" id="answer-btn">Ответ</button>
      <div class="answer" id="answer">«Перо феникса»</div>
    </div>
  </div>

<script>
  const startScreen = document.getElementById('start-screen');
  const quizScreen = document.getElementById('quiz-screen');
  const startBtn = document.getElementById('start-btn');
  const answerBtn = document.getElementById('answer-btn');
  const answer = document.getElementById('answer');

  startBtn.addEventListener('click', () => {
    // анимация ухода стартового экрана
    startScreen.classList.add('fade-out');
    // показ экрана вопроса (с задержкой, чтобы сработала анимация)
    setTimeout(() => {
      quizScreen.classList.add('show');
    }, 250);
  });

  answerBtn.addEventListener('click', () => {
    answer.classList.add('revealed');
    answerBtn.style.display = 'none'; // кнопка исчезает после показа ответа
  });
</script>
</body>
</html>
