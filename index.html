<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по Гарри Поттеру №1</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh; /* корректная высота на мобильных с учётом адресной строки */
    padding: 20px;     /* чтобы блок не прилипал к краям на телефоне */
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    background-attachment: fixed;
  }

  .card {
    width: 100%;
    max-width: 600px;          /* не растягивается на широких экранах */
    padding: clamp(24px, 6vw, 50px) clamp(20px, 8vw, 70px); /* отступы масштабируются */
    border-radius: clamp(16px, 4vw, 25px);
    border: 5px solid #c9a227;
    background: rgba(20, 15, 40, 0.6);
    box-shadow: 0 0 30px rgba(201, 162, 39, 0.4),
                inset 0 0 20px rgba(201, 162, 39, 0.15);
    text-align: center;
  }

  .card h1 {
    color: #f5e6c8;
    font-size: clamp(1.3rem, 5vw, 2.2rem); /* плавно уменьшается на телефоне */
    letter-spacing: clamp(1px, 0.5vw, 2px);
    line-height: 1.3;
    text-shadow: 0 0 10px rgba(201, 162, 39, 0.8);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Тест по Гарри Поттеру №1</h1>
  </div>
</body>
</html>
