<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тесты по Гарри Поттеру</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Georgia', serif;
    overflow: hidden;
    position: relative;
  }

  /* фон fon.jpg с блюром */
  body::before {
    content: "";
    position: fixed;
    inset: -40px;
    background: url('fon.jpg') center / cover no-repeat;
    filter: blur(4px);
    transform: scale(1.05);
    z-index: -2;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 25, 0.55);
    z-index: -1;
  }

  #start-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card-btn {
    width: 100%;
    max-width: 600px;
    padding: clamp(24px, 6vw, 50px) clamp(20px, 8vw, 70px);
    border-radius: clamp(16px, 4vw, 25px);
    border: 5px solid #c9a227;
    background: rgba(20, 15, 40, 0.6);
    box-shadow: 0 0 30px rgba(201, 162, 39, 0.4),
                inset 0 0 20px rgba(201, 162, 39, 0.15);
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    text-decoration: none;
    display: block;
  }
  .card-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 45px rgba(201, 162, 39, 0.7),
                inset 0 0 25px rgba(201, 162, 39, 0.25);
  }
  .card-btn:active { transform: scale(0.98); }

  .card-btn h1 {
    color: #f5e6c8;
    font-size: clamp(1.3rem, 5vw, 2.2rem);
    letter-spacing: clamp(1px, 0.5vw, 2px);
    line-height: 1.3;
    text-shadow: 0 0 10px rgba(201, 162, 39, 0.8);
    font-weight: normal;
  }
</style>
</head>
<body>

  <div id="start-screen">
    <!-- кнопка ведёт на отдельный файл теста -->
    <a class="card-btn" href="test1.html">
      <h1>Тест по Гарри Поттеру №1</h1>
    </a>
  </div>

</body>
</html>
